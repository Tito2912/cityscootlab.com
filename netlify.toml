[build]
  command = "npm run build && python3 scripts/indexnow_submit.py"
  publish = "out"

[[redirects]]
  from = "http://cityscootlab.com/*"
  to = "https://cityscootlab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cityscootlab.com/*"
  to = "https://cityscootlab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cityscootlab.com/*"
  to = "https://cityscootlab.com/:splat"
  status = 301
  force = true

